[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback (functions declared with `path` take precedence over this)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
